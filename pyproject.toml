[project]
name = "tinysql"
version = "0.1.0"
description = "Small text-to-SQL model trained with GRPO on an execution reward"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tinysql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
